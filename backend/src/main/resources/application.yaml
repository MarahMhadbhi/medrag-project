spring:
  application:
    name: medrag
  datasource:
    url: jdbc:postgresql://localhost:5433/medrag
    username: medrag
    password: medrag
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080
  error:
    include-message: always

app:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    chat-model: gemini-3.5-flash
    chat-fallback-model: gemini-3.1-flash-lite
    embedding-model: gemini-embedding-001
    embedding-dimensions: 768
    embedding-batch-size: 20
    embedding-pause-ms: 13000
  rag:
    chunk-size: 800
    chunk-overlap: 100
    top-k: 4
    similarity-threshold: 0.65